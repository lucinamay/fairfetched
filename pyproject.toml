[project]
name = "fairfetched"
version = "0.1.0a20260906"
description = "data APIs for reproducible data fetching in cheminformatics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "polars>=1.35.2",
]

[project.optional-dependencies]
track = ["rich>=14.3.3"]
adrecs = ["fastexcel>=0.12"] # ADReCS / ADReCS-Target's .xlsx;
toxcast = ["fastexcel>=0.12"] # ToxCast's metadata .xlsx
rdkit = [
    "rdkit>=2025.9.6",
]
standardise = [
    "fairfetched[rdkit]",
    "chembl-structure-pipeline>=1.2.4",
    # papyrus-structure-pipeline is copied into prep/papyrus.py; dev tests against it
]
split = [
    "nanoom>=0.1.0a20260815", # fold assignment in prep.split_expr
    "pulp<4", # nanoom 0.1.0a20260815 calls LpVariable(lowBound=...), removed in pulp 4
]
rough = ["scipy>=1.6"] # distances + clustering in prep.rough_expr; 1.6 adds integrate.trapezoid
dev = [
    "pytest>=9.0.2",
    "sqlalchemy>=2.0.46",
    "fairfetched[split]",
    "fairfetched[rough]",
    "fairfetched[standardise]",
    "papyrus-structure-pipeline>=0.0.5", # oracle for prep/papyrus.py
    "fairfetched[adrecs]",
    "fairfetched[toxcast]",
    "rust-just>=1.46.0",
]


[tool.pytest.ini_options]
# -rxX reports every xfail/xpass + reason (c.f. one count) so known bugs with xfail(strict=True) are visible
addopts = "-rxX"

[tool.pyright]
# resolve imports in the uv venv even when pyright runs without it activated
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[tool.setuptools]
package-dir = {"" = "."}
package-data = {"fairfetched.get" = ["manifests/*.json", "_demo/*/*.parquet"]}

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
fairfetched = { workspace = true }

[dependency-groups]
capricho = [
    "capricho>=1.0.4",
]
dev = [
    "chembl-structure-pipeline>=1.2.4",
    "fairfetched[split]",
    "fairfetched[rough]",
    "fastexcel>=0.12",
    "papyrus-structure-pipeline>=0.0.5",
    # "polars[gpu]>=1.35.2",
    "pytest>=9.0.2",
    "rdkit>=2025.9.6",
    "rust-just>=1.46.0",
    "ruff>=0.16.10",
    "pyright>=1.1.414",
]


[project.urls]
Homepage = "https://github.com/lucinamay/fairfetched"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
